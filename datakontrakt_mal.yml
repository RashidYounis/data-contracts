# Datakontraktsmal — ODCS v3.1.0 (Open Data Contract Standard, Bitol/LF AI & Data)
# Spesifikasjon: https://bitol-io.github.io/open-data-contract-standard/latest/
#
# En datakontrakt er en forpliktelse fra dataleverandør mot konsumenter, og skal
# dekke fem dimensjoner som validate_contracts.py håndhever:
#   1. Eierskap       — hvem svarer for leveransen (seksjon 2)
#   2. Klassifisering — klassifiseringsnivå + kategorisering per kolonne,
#                       personvern, oppbevaring (seksjon 4 + 6 + 5)
#   3. Innhold        — struktur, grensesnitt, kvalitet, stabilitet (seksjon 3–5)
#   4. Semantikk      — hva dataen betyr og hvor den kommer fra (seksjon 4 + 7)
#   5. Versjonering   — semver, varslingsfrist, livsløp (seksjon 1 + 5 + 6)
#
# Fyll ut alle felter merket med TODO.
# Felter merket [valgfri] kan utelates, men anbefales.
#
# SB1U-profil: ODCS har ingen native felter for alle norske styringskrav
# (klassifisering på datasett/kontrakt, kategorisering, GDPR-rettsgrunnlag,
# varslingsfrist). Disse ligger som customProperties med faste navn som
# validatoren krever — se seksjon 4 (per kolonne) og seksjon 6 (per kontrakt).

apiVersion: v3.1.0
kind: DataContract

# ── 1. FUNDAMENTALS ───────────────────────────────────────────────────────────
id: TODO               # Unik ID — UUID eller URN, f.eks. "urn:datacontract:dp-example:kredittkunde-core"
name: TODO             # Teknisk navn, f.eks. "kredittkunde_core_v1"
version: "1.0.0"       # Semantisk versjon av kontrakten
status: draft          # proposed | draft | active | deprecated | retired
domain: TODO           # Forretningsdomene, f.eks. "risiko"
tenant: SB1U           # Organisasjon som eier dataen

description:
  purpose: TODO        # Hva inneholder dette dataproduktet, og hva er det laget for?
  usage: TODO          # Hvordan er det tenkt brukt? Typiske bruksmønstre.
  limitations: TODO    # Kjente begrensninger — hva dataen IKKE kan brukes til.

tags:                  # [valgfri] Frie nøkkelord for søk i katalogen
  - TODO

# ── 2. EIERSKAP (team + support) ──────────────────────────────────────────────
# ODCS uttrykker eierskap via team.members med roller, og kontaktpunkter via
# support. SB1U-profilen krever minst én member med role "Owner".
team:
  name: TODO           # Teamnavn, f.eks. "Example Data Team"
  description: TODO    # [valgfri] Kort om teamets ansvar
  members:
    - username: TODO   # E-post eller brukernavn til produkteier
      name: TODO       # [valgfri] Fullt navn
      role: Owner      # Må være "Owner" for den ansvarlige
      dateIn: "TODO"   # Dato personen tok over ansvaret, f.eks. "2026-01-15"

    - username: TODO   # E-post til data steward / forvalter
      name: TODO
      role: Data Steward
      dateIn: "TODO"

# Kontaktkanaler. SB1U-profilen krever minst én kanal med tool: email.
support:
  - channel: TODO      # Team-e-post, f.eks. "example-data-team@example.com"
    tool: email
    url: TODO          # mailto:-URL til samme adresse
    scope: interactive
  - channel: TODO      # [valgfri] Slack-kanal, f.eks. "#dp-example-data"
    tool: slack
    scope: issues

# ── 3. GRENSESNITT (servers) ──────────────────────────────────────────────────
servers:
  - server: production
    type: snowflake
    environment: prod
    account: TODO      # Snowflake-konto
    warehouse: TODO    # Warehouse som brukes for lesing
    database: TODO     # f.eks. EXAMPLE_DB__PROD__MAIN
    schema: TODO       # f.eks. SERVING

# ── 4. INNHOLD OG SEMANTIKK (schema) ──────────────────────────────────────────
# I ODCS heter datasettene `schema` (liste av objekter) og kolonnene `properties`.
# Denne seksjonen dekker både struktur (hva feltene er) og semantikk (hva de
# betyr, og hvor de kommer fra).
schema:
  - name: TODO             # Logisk navn på datasettet
    physicalName: TODO     # Faktisk tabellnavn i Snowflake
    physicalType: table    # table | view
    businessName: TODO     # [valgfri] Leservennlig navn
    description: TODO      # Hva inneholder tabellen? Én rad representerer hva?
    dataGranularityDescription: TODO   # Granularitet, f.eks. "én rad per kunde per dag"
    tags: []               # [valgfri]

    properties:
      - name: TODO             # Kolonnenavn
        businessName: TODO     # Forretningsbegrep — hva kolonnen heter for folk
        logicalType: string    # string | date | timestamp | time | number | integer | object | array | boolean
        physicalType: TODO     # Faktisk Snowflake-type, f.eks. VARCHAR(20), NUMBER(18,2)
        description: TODO      # Alle kolonner skal beskrives
        required: true         # true = NOT NULL (erstatter det gamle "nullable")
        unique: false
        primaryKey: true       # Minst én property må ha primaryKey: true
        primaryKeyPosition: 1  # 1-basert posisjon i nøkkelen, -1 hvis ikke del av nøkkel
        # KLASSIFISERING — påkrevd på alle kolonner. Fastsetter beskyttelsesnivå,
        # kontrolltiltak og bruksbegrensninger.
        #   aapen             — offentlig tilgjengelig, kan deles fritt
        #   intern            — intern bruk, sporbar, ikke eksternt uten vurdering
        #   fortrolig         — kun autoriserte med tjenstlig behov
        #   strengt_fortrolig — særskilt begrenset krets, fullt sporbar
        classification: TODO
        criticalDataElement: false
        tags: []               # Bruk tag "pii" på kolonner som inneholder persondata

        # KATEGORISERING — påkrevd på alle kolonner. Manglende kategorisering er
        # ikke tillatt. Kategoriseringen er maskinlesbart grunnlag for automatisert
        # tilgangsstyring, logging og revisjon, og inngår ved fastsettelse av
        # klassifiseringsnivå — men fastsetter det ikke automatisk.
        customProperties:
          - property: personopplysning     # PÅKREVD
            # ingen      — inneholder ikke personopplysninger
            # alminnelig — personopplysning etter GDPR art. 4
            # skpo       — særlige kategorier etter GDPR art. 9 (krever strengt_fortrolig)
            value: TODO
          - property: personidentifikator  # PÅKREVD
            # direkte              — kan alene identifisere en fysisk person
            # indirekte            — bidrar sammen med andre opplysninger
            # ikke_identifiserende — kan ikke identifisere en person
            value: TODO

        # Dataavstamming: hvilke kilder kolonnen er utledet fra. Uten dette kan
        # ikke konsumenter se hvor dataen kommer fra.
        transformSourceObjects:
          - TODO               # f.eks. "core.kunde"
        transformDescription: TODO   # Hva som skjer med dataen, i forretningstermer
        transformLogic: ""     # [valgfri] SQL-uttrykket, hvis nyttig

        # Datakvalitet per kolonne. Primærnøkkel skal ha både null- og duplikatsjekk.
        quality:
          - metric: nullValues
            mustBe: 0
            dimension: completeness
            severity: error
            description: "Primærnøkkel skal aldri være null."
          - metric: duplicateValues
            mustBe: 0
            dimension: uniqueness
            severity: error
            description: "Primærnøkkel skal være unik."

      # Legg til flere kolonner etter behov…

    # Kvalitetsregler på tabellnivå. Minst én kvalitetsregel — på tabell eller
    # kolonne — er påkrevd: kontrakten skal forplikte på kvalitet, ikke bare struktur.
    quality:
      - metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: "Tabellen skal ikke være tom."

    # Samlet klassifisering for datasettet. ODCS har `classification` kun på
    # kolonner, så nivået på datasettnivå uttrykkes som customProperty. Anbefalt
    # når kontrakten leverer flere datasett med ulik klassifisering. Nivået kan
    # ikke være mindre strengt enn den strengeste kolonnen under seg.
    customProperties:
      - property: dataClassification
        value: TODO          # aapen | intern | fortrolig | strengt_fortrolig

# ── 5. SLA OG LIVSLØP (slaProperties) ─────────────────────────────────────────
# ODCS bruker `latency` (ikke "freshness") for hvor gammel dataen kan være,
# `frequency` for oppdateringsfrekvens og `retention` for oppbevaringstid.
slaProperties:
  # Ferskhet og frekvens
  - property: latency          # PÅKREVD — maks akseptabel forsinkelse
    value: TODO                # f.eks. 24
    unit: h                    # h | d | y
    element: TODO              # "objekt.kolonne" som måles, f.eks. "kredittkunde.oppdatert_dato"
    driver: analytics          # regulatory | analytics | operational

  - property: frequency        # Oppdateringsfrekvens
    value: 1
    unit: d
    element: TODO
    scheduler: cron
    schedule: "0 6 * * *"      # Faktisk kjøreplan

  # Stabilitet — påkrevd for status: active
  - property: availability     # Tilgjengelighetsmål
    value: 99.5
    unit: percent

  - property: timeToNotify     # Hvor raskt konsumenter varsles ved avvik
    value: TODO                # f.eks. 4
    unit: h
    driver: operational

  # Oppbevaring
  - property: retention        # PÅKREVD — oppbevaringstid
    value: TODO                # f.eks. 7
    unit: y                    # d | y
    element: TODO
    driver: regulatory

  # Livsløp — grunnlaget for versjonshåndtering og avvikling.
  # endOfSupport og endOfLife er PÅKREVD når status er deprecated eller retired.
  - property: generalAvailability
    value: TODO                # ISO-tidspunkt, f.eks. "2026-10-01T00:00:00+02:00"
  - property: endOfSupport
    value: TODO
  - property: endOfLife
    value: TODO

# ── 6. SB1U-SPESIFIKKE STYRINGSKRAV (customProperties) ────────────────────────
# Disse egenskapsnavnene er påkrevd av SB1U-profilen og valideres av
# validate_contracts.py. Ikke gi dem andre navn.
customProperties:
  - property: dataClassification      # PÅKREVD — samlet nivå for hele leveransen
    value: TODO                       # aapen | intern | fortrolig | strengt_fortrolig

  - property: containsPersonalData    # PÅKREVD
    value: false                      # true | false

  - property: gdprLegalBasis          # PÅKREVD hvis containsPersonalData = true
    value: ""                         # f.eks. "legitimate_interest" | "contract" | "consent"

  - property: breakingChangeNoticeDays  # PÅKREVD — minst 30
    value: 90                           # Dager konsumenter varsles før en breaking change

  - property: githubTeam              # Anbefalt
    value: TODO                       # f.eks. "@example-org/example-data-team"

  - property: consumers               # [valgfri] Kjente konsumenter
    value:
      - team: TODO
        useCase: TODO

# ── 7. REFERANSER OG SEMANTIKK (authoritativeDefinitions) ─────────────────────
# `implementation` er PÅKREVD — den utgjør dataavstammingen oppstrøms og viser
# hvilken kode som produserer leveransen.
authoritativeDefinitions:
  - type: implementation
    url: TODO                          # dbt-modellen som implementerer kontrakten
    description: dbt-modell som produserer datasettet — oppstrøms dataavstamming.

  - type: canonical                    # Anbefalt
    url: TODO                          # Kontraktens plassering i Git
    description: Kanonisk versjon av denne kontrakten.

  - type: businessDefinition           # Anbefalt — hva dataen betyr
    url: TODO                          # Begrepskatalog eller definisjonskilde
    description: Begrepsapparat som forklarer innholdet.

  - type: privacy-statement            # [valgfri, anbefalt ved persondata]
    url: TODO
    description: Personvernerklæring for behandlingen.
