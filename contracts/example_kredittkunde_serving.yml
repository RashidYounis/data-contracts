# Eksempelkontrakt — kun for å illustrere kontraktsformatet.
# Basert på et tenkt "kredittkunde"-dataprodukt i serving-laget.
# Alle navn, adresser og URL-er er nøytrale plassholdere.
# Følger ODCS v3.1.0: https://bitol-io.github.io/open-data-contract-standard/latest/

apiVersion: v3.1.0
kind: DataContract

id: "urn:datacontract:dp-example:kredittkunde-serving"
name: kredittkunde_serving_v1
version: "1.2.0"
status: active
domain: risiko
tenant: ExampleOrg

description:
  purpose: >
    Aggregert kundebilde for kredittrisiko-analyser. Inneholder scoringer,
    engasjementsdata og klassifisering per kunde. Primær kilde for
    risikorapportering og modellutvikling.
  usage: >
    Leses direkte fra Snowflake av modellutviklings- og rapporteringsteam.
    Én rad per kunde med siste gyldige risikoscore.
  limitations: >
    Kun kunder med aktivt kredittengasjement. Historikk finnes ikke i denne
    tabellen — bruk KREDITTKUNDE_HISTORIKK for tidsserier.

tags:
  - kredittrisiko
  - serving

team:
  name: "Example Data Team"
  description: Eier og forvalter dataprodukter for kredittrisiko.
  members:
    - username: "produkteier@example.com"
      name: "Eksempel Eier"
      role: Owner
      dateIn: "2025-09-01"
    - username: "forvalter@example.com"
      name: "Eksempel Forvalter"
      role: Data Steward
      dateIn: "2025-09-01"

support:
  - channel: "example-data-team@example.com"
    tool: email
    url: "mailto:example-data-team@example.com"
    scope: interactive
  - channel: "#dp-example-data"
    tool: slack
    scope: issues

servers:
  - server: production
    type: snowflake
    environment: prod
    account: example-account
    warehouse: EXAMPLE_WH
    database: EXAMPLE_DB__PROD__MAIN
    schema: SERVING

schema:
  - name: kredittkunde
    physicalName: KREDITTKUNDE
    physicalType: table
    businessName: "Kredittkunde – Serving"
    description: "En rad per unikt kundeengasjement med siste gyldige risikoscore."
    dataGranularityDescription: "Én rad per kunde_id."

    properties:
      - name: kunde_id
        businessName: "Kundeidentifikator"
        logicalType: string
        physicalType: VARCHAR(20)
        description: "Intern kundeid – pseudonymisert."
        required: true
        unique: true
        primaryKey: true
        primaryKeyPosition: 1
        classification: fortrolig
        criticalDataElement: true
        tags: ["pii"]
        # Kategorisering — påkrevd på alle kolonner, grunnlag for automatisert
        # tilgangsstyring, logging og revisjon.
        customProperties:
          - property: personopplysning
            value: alminnelig
          - property: personidentifikator
            value: indirekte
        transformSourceObjects:
          - core.kunde
        transformDescription: >
          Hentes direkte fra kundemasteren uten omforming.
        quality:
          - metric: nullValues
            mustBe: 0
            dimension: completeness
            severity: error
            description: "Primærnøkkel skal aldri være null."
          - metric: duplicateValues
            mustBe: 0
            dimension: uniqueness
            severity: error
            description: "Primærnøkkel skal være unik."

      - name: foedselsdato
        businessName: "Fødselsdato"
        logicalType: date
        physicalType: DATE
        description: "Kundens fødselsdato."
        required: false
        primaryKey: false
        primaryKeyPosition: -1
        classification: fortrolig
        tags: ["pii"]
        customProperties:
          - property: personopplysning
            value: alminnelig
          - property: personidentifikator
            value: indirekte
        transformSourceObjects:
          - core.person
        transformDescription: >
          Hentes fra personregisteret, koblet på kundeidentifikator.

      - name: engasjement_beloep
        businessName: "Utestående engasjement"
        logicalType: number
        physicalType: NUMBER(18,2)
        description: "Totalt utestående engasjementsbeløp i NOK."
        required: true
        primaryKey: false
        primaryKeyPosition: -1
        classification: fortrolig
        criticalDataElement: true
        customProperties:
          - property: personopplysning
            value: alminnelig
          - property: personidentifikator
            value: indirekte
        transformSourceObjects:
          - core.laan
          - core.kredittramme
        transformDescription: >
          Summen av utestående saldo på alle aktive lån og trukket beløp på
          kredittrammer, per kunde.

      - name: pd_score
        businessName: "Misligholdssannsynlighet (PD)"
        logicalType: number
        physicalType: NUMBER(6,4)
        description: "Probability of Default, tall mellom 0 og 1."
        required: false
        primaryKey: false
        primaryKeyPosition: -1
        classification: fortrolig
        criticalDataElement: true
        customProperties:
          - property: personopplysning
            value: alminnelig
          - property: personidentifikator
            value: indirekte
        transformSourceObjects:
          - modell.pd_scoring
        transformDescription: >
          Siste gyldige score fra PD-modellen. Null hvis kunden ikke er scoret,
          f.eks. ved for kort historikk.

      - name: risiko_klasse
        businessName: "Risikoklasse"
        logicalType: string
        physicalType: VARCHAR(5)
        description: "Risikoklasse A–E basert på PD-score."
        required: true
        primaryKey: false
        primaryKeyPosition: -1
        classification: fortrolig
        customProperties:
          - property: personopplysning
            value: alminnelig
          - property: personidentifikator
            value: indirekte
        transformSourceObjects:
          - modell.pd_scoring
        transformDescription: >
          Diskretisering av PD-score til fem klasser etter intern
          risikoklassifiseringsmodell. A er lavest risiko.
        quality:
          - metric: nullValues
            mustBe: 0
            dimension: completeness
            severity: error
            description: "Risikoklasse skal alltid være satt."
          - metric: invalidValues
            mustBe: 0
            arguments:
              validValues: ["A", "B", "C", "D", "E"]
            dimension: conformity
            severity: error
            description: "Risikoklasse skal være én av A–E."

      - name: oppdatert_dato
        businessName: "Sist oppdatert"
        logicalType: date
        physicalType: DATE
        description: "Dato for siste oppdatering av raden."
        required: true
        primaryKey: false
        primaryKeyPosition: -1
        classification: intern
        # Teknisk kjøredato — ingen personopplysninger, ikke identifiserende.
        customProperties:
          - property: personopplysning
            value: ingen
          - property: personidentifikator
            value: ikke_identifiserende
        transformSourceObjects:
          - modell.pd_scoring
        transformDescription: >
          Settes til kjøredato for batchen som produserte raden. Brukes som
          målepunkt for ferskhets-SLA.

    quality:
      - metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: "Tabellen skal ikke være tom."

    # Samlet klassifisering for datasettet. ODCS har ikke `classification` på
    # objektnivå, kun på kolonner, så nivået uttrykkes som customProperty.
    customProperties:
      - property: dataClassification
        value: fortrolig

slaProperties:
  # Ferskhet og frekvens
  - property: latency
    value: 24
    unit: h
    element: kredittkunde.oppdatert_dato
    driver: analytics
  - property: frequency
    value: 1
    unit: d
    element: kredittkunde.oppdatert_dato
    scheduler: cron
    schedule: "0 6 * * *"

  # Stabilitet
  - property: availability
    value: 99.5
    unit: percent
  - property: timeToNotify
    value: 4
    unit: h
    driver: operational

  # Oppbevaring
  - property: retention
    value: 7
    unit: y
    element: kredittkunde.oppdatert_dato
    driver: regulatory

  # Livsløp — konsumenter planlegger avhengigheter etter disse datoene
  - property: generalAvailability
    value: "2025-10-01T00:00:00+02:00"
  - property: endOfSupport
    value: "2028-10-01T00:00:00+02:00"
  - property: endOfLife
    value: "2029-10-01T00:00:00+02:00"

customProperties:
  - property: dataClassification
    value: fortrolig
  - property: containsPersonalData
    value: true
  - property: gdprLegalBasis
    value: legitimate_interest
  - property: githubTeam
    value: "@example-org/example-data-team"
  - property: breakingChangeNoticeDays
    value: 90
  - property: consumers
    value:
      - team: "Kredittmodeller"
        useCase: "Inndata til PD-modeller"
      - team: "Risikorapportering"
        useCase: "Månedlig porteføljerapport"

authoritativeDefinitions:
  - type: canonical
    url: "https://github.com/example-org/dp-example/blob/main/contracts/kredittkunde_serving.yml"
    description: Kanonisk versjon av denne kontrakten.
  - type: implementation
    url: "https://github.com/example-org/dp-example/blob/main/dbt/models/serving/kredittkunde.yml"
    description: dbt-modell som produserer datasettet — oppstrøms dataavstamming.
  - type: businessDefinition
    url: "https://example.com/begrepskatalog/kredittrisiko"
    description: Begrepsapparat for kredittrisiko — hva scoringer og klasser betyr.
  - type: privacy-statement
    url: "https://example.com/personvern/kredittdata"
    description: Personvernerklæring for behandling av kredittdata.
