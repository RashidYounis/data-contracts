name: Valider datakontrakter

# Datakontrakter skal som minimum brukes som gate ved kontrollert utrulling,
# slik at endringer ikke bryter avhengigheter nedstrøms i dataverdikjeden.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Valider kontrakter
        run: python validate_contracts.py

      - name: Last opp HTML-rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-report
          path: contracts_report.html
          if-no-files-found: warn
